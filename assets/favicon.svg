<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="TwoBots">
  <title>TwoBots</title>
  <!-- Steel-blue tile: the Izzet U. Same 512/rx=112 tile convention as the other
       per-domain marks, so the favicon set stays visually consistent. -->
  <rect width="512" height="512" rx="112" fill="#275E8C"/>
  <g fill="#FDF4EE">
    <!-- Two heads, not one face: the name is the mark. Kept to two big rounded
         rectangles with one eye each so it still reads as TWO shapes at 16px, where
         a detailed robot collapses into mush. -->
    <rect x="86" y="196" width="150" height="160" rx="38"/>
    <rect x="276" y="196" width="150" height="160" rx="38"/>
    <!-- antennae -->
    <rect x="153" y="132" width="16" height="52" rx="8"/>
    <rect x="343" y="132" width="16" height="52" rx="8"/>
    <circle cx="161" cy="124" r="24"/>
    <circle cx="351" cy="124" r="24"/>
  </g>
  <!-- Eyes in the ornament orange: the Izzet R, used as a pip rather than as text. -->
  <g fill="#D06B22">
    <circle cx="161" cy="268" r="30"/>
    <circle cx="351" cy="268" r="30"/>
    <rect x="121" y="316" width="80" height="17" rx="8.5"/>
    <rect x="311" y="316" width="80" height="17" rx="8.5"/>
  </g>
</svg>
