# Serves the landing page inside the image (replaces nginx:alpine's default.conf).
#
# Single page, so there are no directory indexes and none of the trailing-slash
# redirect trouble the minified.work site needed `absolute_redirect off` for. The
# settings here are about caching and not leaking the server version.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ayula intercepts 404s and serves the branded twobots.dev page, but this keeps
    # the version out of anything reached directly over the LAN.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/xml image/svg+xml application/json;
    # NB: woff2 is already compressed — gzipping it again wastes CPU for nothing,
    # so it is deliberately absent from gzip_types.

    # The page is one file and changes on deploy, so it must revalidate. The fonts
    # fonts, favicon and fonts.css are content-stable and immutable in practice.
    # fonts.css riding this 30-day cache is exactly why it is linked rather than
    # inlined into the no-cache page.
    location = / { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
